<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Days of You ♡ — Shibu & Aaru</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --paper:#f7eee4; --paper2:#fff9f3; --ink:#332b2b; --pink:#d98f9b;
  --pink2:#efc4ca; --line:#ddc8ba; --shadow:rgba(66,44,44,.16);
}
*{box-sizing:border-box}
body{margin:0;background:#d9c7b7;color:var(--ink);font-family:"DM Sans",sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#5f4848 0.6px,transparent .6px);background-size:7px 7px}
button,a{font:inherit}
.screen{min-height:100vh;display:none;padding:28px 16px;align-items:center;justify-content:center}
.screen.active{display:flex}
.paper{width:min(930px,100%);min-height:min(700px,calc(100vh - 56px));background:var(--paper);border:1px solid #cbb4a5;box-shadow:0 18px 50px var(--shadow);position:relative;overflow:hidden;padding:clamp(24px,5vw,58px);transform:rotate(-.25deg)}
.paper:after{content:"";position:absolute;inset:14px;border:1px dashed #d6bfb0;pointer-events:none}
h1,h2,.hand{font-family:Caveat,cursive}
h1{font-size:clamp(58px,10vw,100px);line-height:.86;margin:0 0 18px}
h2{font-size:clamp(42px,7vw,64px);margin:0 0 10px}
p{line-height:1.65}
.cover{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.tiny{font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.subtitle{font-size:18px;max-width:520px}
.signature{font-family:Caveat;font-size:28px;margin-top:24px}
.tape{position:absolute;width:105px;height:28px;background:#ead4ad;opacity:.72;transform:rotate(-7deg);top:35px;left:50%;margin-left:-52px;z-index:2}
.scrap{position:absolute;font-family:Caveat;font-size:22px}
.s1{left:28px;top:30px}.s2{right:28px;bottom:28px}.s3{right:32px;top:75px}
.start{border:0;background:var(--ink);color:white;padding:13px 24px;border-radius:30px;cursor:pointer;position:relative;z-index:3;margin-top:20px;box-shadow:0 7px 0 #b9a49a;transition:.2s}
.start:active{transform:translateY(4px);box-shadow:0 3px 0 #b9a49a}
.menu{text-align:center}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:620px;margin:42px auto}
.heart{border:0;background:none;cursor:pointer;position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:white;font-family:Caveat;font-size:29px;transition:.25s;z-index:2}
.heart:before{content:"♥";position:absolute;font-family:Arial;font-size:92px;color:var(--pink2);text-shadow:0 6px 0 rgba(150,90,100,.16);z-index:-1;transition:.25s}
.heart:hover:before{transform:scale(1.12) rotate(-4deg);color:var(--pink)}
.heart.locked{filter:grayscale(.8);opacity:.75}
.day-layout{display:grid;grid-template-columns:minmax(240px,40%) 1fr;gap:38px;align-items:center;min-height:500px}
.photo-wrap{position:relative;transform:rotate(-3deg)}
.polaroid{background:white;padding:13px 13px 45px;box-shadow:0 10px 25px rgba(50,35,35,.15)}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(135deg,#eee0d4,#d9c2ba);display:flex;align-items:center;justify-content:center;color:#7b6660;font-family:Caveat;font-size:25px;text-align:center}
.caption{text-align:center;font-family:Caveat;font-size:22px;margin-top:-36px;position:relative}
.day-copy{position:relative;z-index:2}
.label{font-size:13px;letter-spacing:.15em;text-transform:uppercase}
.reason{font-family:Caveat;font-size:32px;line-height:1.18;margin:12px 0 18px}
.song{display:flex;align-items:center;gap:13px;border:1px solid #cdb8aa;border-radius:16px;padding:13px 15px;background:rgba(255,255,255,.45);margin-top:22px}
.disc{width:46px;height:46px;border-radius:50%;background:#3b3333;display:grid;place-items:center;color:white;flex:none}
.song-title{font-weight:600}.song-artist{font-size:13px;opacity:.7;margin-top:3px}
.play{margin-left:auto;text-decoration:none;color:var(--ink);border:1px solid #bba59a;padding:7px 11px;border-radius:18px;font-size:12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:25px;position:relative;z-index:3}
.nav button{border:0;background:none;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.playlist{max-width:650px;margin:30px auto}.track{display:flex;gap:14px;align-items:center;padding:15px 4px;border-bottom:1px dashed #cdb8aa}.num{font-family:Caveat;font-size:27px;width:30px}.track a{color:var(--ink);text-decoration:none}.track a:hover{text-decoration:underline}
.final{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.final h1{font-size:clamp(55px,9vw,88px)}
.final p{max-width:600px;font-family:Caveat;font-size:29px;line-height:1.25}
.secret{margin-top:20px;border:1px dashed #b99f91;padding:12px 20px;background:#efc4ca;border-radius:10px;font-family:Caveat;font-size:22px}
.edit-note{font-size:12px;opacity:.7;margin-top:25px}
@media(max-width:680px){
  .screen{padding:12px}.paper{min-height:calc(100vh - 24px);padding:27px 20px}.paper:after{inset:8px}
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:16px;margin:28px auto}
  .day-layout{grid-template-columns:1fr;gap:20px;min-height:auto}.photo-wrap{max-width:260px;margin:auto}
  .reason{font-size:29px}.s1,.s3{display:none}
}
</style>
</head>
<body>

<section class="screen active" id="cover">
  <div class="paper cover">
    <div class="tape"></div>
    <div class="scrap s1">to my favourite person ♡</div>
    <div class="scrap s2">— aaru ♡</div>
    <div class="scrap s3">shibu & aaru</div>
    <div class="tiny">a tiny internet scrapbook</div>
    <h1>7 days<br>of you ♡</h1>
    <p class="subtitle">7 little things I like about you, 7 songs, and a tiny piece of my heart.</p>
    <div class="signature">made especially for Shibu ♡</div>
    <button class="start" onclick="show('menu')">click to begin →</button>
  </div>
</section>

<section class="screen" id="menu">
  <div class="paper menu">
    <div class="tiny">shibu ♡ aaru</div>
    <h2>pick a heart</h2>
    <p>each one has a little something waiting for you.</p>
    <div class="menu-grid">
      <button class="heart" onclick="show('day1')">1</button>
      <button class="heart" onclick="show('day2')">2</button>
      <button class="heart" onclick="show('day3')">3</button>
      <button class="heart" onclick="show('day4')">4</button>
      <button class="heart" onclick="show('day5')">5</button>
      <button class="heart" onclick="show('day6')">6</button>
      <button class="heart locked" onclick="show('day7')">7 ♡</button>
      <button class="heart" onclick="show('songs')">♪</button>
    </div>
    <p class="hand" style="font-size:24px">take your time... ♡</p>
  </div>
</section>

<script>
const data = {
  day1:{n:"01", title:"your fangs", text:"Your little fangs. Idk why but they're genuinely SO CUTE 😭 They make you look so soft and a little bit dangerous at the same time... and I love that about you.", song:"Sawaar Loon", artist:"Monali Thakur", search:"Sawaar Loon Monali Thakur"},
  day2:{n:"02", title:"how emotional you are", text:"I love how emotional you are. You actually feel things so deeply, and I think that's really beautiful.", song:"Moonlit Floor", artist:"LISA", search:"Moonlit Floor LISA"},
  day3:{n:"03", title:"the way you blush", text:"THE WAY YOU BLUSH 😭😭 I don't think you realise how cute you look when you do.", song:"Dilliwali Girlfriend", artist:"Arijit Singh, Sunidhi Chauhan", search:"Dilliwali Girlfriend"},
  day4:{n:"04", title:"how much you care", text:"You care SOOOOO much. About people, about little things, about me... and honestly, that's one of my favourite things about you.", song:"Main Tera Boyfriend", artist:"Arijit Singh, Neha Kakkar", search:"Main Tera Boyfriend"},
  day5:{n:"05", title:"your cuteeeee dimples", text:"Your CUTEeeeeeeee dimples. That's it. That's the whole reveal. I rest my case.", song:"Sunroof", artist:"Nicky Youre, dazy", search:"Sunroof Nicky Youre dazy"},
  day6:{n:"06", title:"your pure heart ♡", text:"You have such a pureeeeeeeeeeee heart. Please never let the world make you lose that part of yourself.", song:"Samjhawan", artist:"Arijit Singh, Shreya Ghoshal", search:"Samjhawan"},
  day7:{n:"07", title:"pura hi tum ♡", text:"And honestly... pura hii tu bohot pyaara hai. I could make a list of a hundred things, but it still wouldn't be enough.", song:"Khuda Jaane", artist:"KK, Shilpa Rao", search:"Khuda Jaane"}
};

function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function spotify(q){ return 'https://open.spotify.com/search/' + encodeURIComponent(q); }
function dayPage(id){
  const d=data[id];
  return `<section class="screen" id="${id}">
    <div class="paper">
      <div class="tiny">day ${d.n} ♡</div>
      <div class="day-layout">
        <div class="photo-wrap">
          <div class="polaroid">
            <div class="photo"><span>your photo<br>day ${d.n}<br>♡</span></div>
            <div class="caption">my favourite view ♡</div>
          </div>
        </div>
        <div class="day-copy">
          <div class="label">one little thing</div>
          <h2>${d.title}</h2>
          <div class="reason">${d.text}</div>
          <div class="song">
            <div class="disc">♪</div>
            <div><div class="song-title">${d.song}</div><div class="song-artist">${d.artist}</div></div>
            <a class="play" target="_blank" href="${spotify(d.search)}">open ♫</a>
          </div>
        </div>
      </div>
      <div class="nav"><button onclick="show('menu')">← hearts</button><button onclick="next('${id}')">next →</button></div>
      <div class="edit-note">PHOTO PLACEHOLDER — replace photos/day${d.n}.jpg later.</div>
    </div>
  </section>`;
}
document.write(Object.keys(data).map(dayPage).join(''));

document.write(`<section class="screen" id="songs"><div class="paper">
  <div class="tiny">the soundtrack ♡</div><h2>the 7 songs</h2>
  <p>because apparently seven days deserve a whole soundtrack.</p>
  <div class="playlist">
    ${Object.values(data).map((d,i)=>`<div class="track"><div class="num">${i+1}.</div><a target="_blank" href="${spotify(d.search)}">${d.song} — ${d.artist}</a><span style="margin-left:auto">↗</span></div>`).join('')}
  </div>
  <div class="nav"><button onclick="show('menu')">← hearts</button><button onclick="show('final')">final page →</button></div>
</div></section>`);

document.write(`<section class="screen" id="final"><div class="paper final">
  <div class="tiny">and just like that...</div>
  <h1>7 days<br>already feels like<br>a little lifetime ♡</h1>
  <p>Thank you for being you, Shibu. You make my days brighter, my heart softer, and my world so much more beautiful.</p>
  <p>I'm so lucky to have you.<br>I love you, always. ♡</p>
  <div class="secret">♡ — Aaru</div>
  <button class="start" onclick="show('menu')">read it again ↺</button>
</div></section>`);

function next(id){
  const ids=['day1','day2','day3','day4','day5','day6','day7'];
  const i=ids.indexOf(id);
  show(i===ids.length-1?'songs':ids[i+1]);
}
</script>
</body>
</html>
